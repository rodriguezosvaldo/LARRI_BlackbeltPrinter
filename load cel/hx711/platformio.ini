; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; One firmware for both printers; the environment picks the printer (pins, Duet IP, ntfy topic):
;   pio run -e p1 -t upload -t monitor     (P1-243, ESP32-S3-WROOM-1)
;   pio run -e p2 -t upload -t monitor     (P2-188, classic ESP32-WROOM-32 DevKit)

[env]
platform = espressif32
framework = arduino
lib_deps =
    bogde/HX711@^0.7.5
    bblanchon/ArduinoJson@^7.2.1
monitor_speed = 115200

[env:p1]
board = esp32-s3-devkitc-1
build_flags = -D PRINTER_NUM=1
; Serial goes to the "COM"/UART USB port by default. If you plug into the native "USB" port
; instead (or the board only has that one), add -D ARDUINO_USB_CDC_ON_BOOT=1 above.

[env:p2]
board = esp32dev
build_flags = -D PRINTER_NUM=2
