; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; One firmware for both printers; the environment picks the printer (pins, Duet IP, ntfy topic):
;   pio run -e p1 -t upload -t monitor     (P1-243, ESP32-S3-WROOM-1)
;   pio run -e p2 -t upload -t monitor     (P2-188, ESP32-S3-WROOM-1)

[env]
platform = espressif32
framework = arduino
lib_deps =
    bogde/HX711@^0.7.5
    bblanchon/ArduinoJson@^7.2.1
monitor_speed = 115200

[env:p1]
board = esp32-s3-devkitc-1
build_flags = -D PRINTER_NUM=1
; Serial goes to the "COM"/UART USB port by default. If you plug into the native "USB" port
; instead (or the board only has that one), add -D ARDUINO_USB_CDC_ON_BOOT=1 above.

[env:p2]
board = esp32-s3-devkitc-1
; Plugged into the S3's native "USB" port, so Serial goes there (CDC on boot)
build_flags = -D PRINTER_NUM=2 -D ARDUINO_USB_CDC_ON_BOOT=1

; Firmware update over WiFi (needs OTA_PASS in secrets.h and a first USB flash with it):
;   pio run -e p1_ota -t upload      (--upload-port <ip> if the ESP32's DHCP address changed)
; Refused while the printer has a job; set OTA_FORCE=1 to update anyway.
; Also from the browser: http://<esp32-ip>/update with .pio/build/p1_ota/firmware.bin
[ota]
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/ota_upload.py" $UPLOAD_PORT "$SOURCE"

[env:p1_ota]
extends = env:p1, ota
upload_port = 192.168.1.132

[env:p2_ota]
extends = env:p2, ota
upload_port = 192.168.1.187
