; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Previous board: classic ESP32 (ESP32-WROOM-32 DevKit)
; [env:esp32dev]
; platform = espressif32
; board = esp32dev
; framework = arduino
; lib_deps = bogde/HX711@^0.7.5
; monitor_speed = 115200

; Current board: ESP32-S3-WROOM-1
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = bogde/HX711@^0.7.5
monitor_speed = 115200
; Serial goes to the "COM"/UART USB port by default. If you plug into the native "USB" port
; instead (or the board only has that one), uncomment this so Serial shows up there:
; build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1
