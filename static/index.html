<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BB Printer Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: "Patrick Hand", "Segoe Print", cursive;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .dashboard {
      width: min(1100px, 100%);
      border: 1px solid #555;
      border-radius: 14px;
      background: #141414;
      overflow: hidden;
    }

    .header {
      border-bottom: 1px solid #555;
      padding: 0.75rem 1rem;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .column {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .column + .column {
      border-left: 1px solid #555;
    }

    .status-box {
      border: 1px solid #555;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      min-height: 52px;
      word-break: break-all;
    }

    .value {
      color: #d8ffd8;
    }

    .value.muted {
      color: #888;
    }

    @media (max-width: 700px) {
      .columns {
        grid-template-columns: 1fr;
      }

      .column + .column {
        border-left: none;
        border-top: 1px solid #555;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <header class="header" id="clock">—</header>
    <header class="header">Values bellow are updated to this date and time</header>

    <div class="columns">
      <section class="column" data-printer="1">
        <div class="status-box" id="status-1">—</div>
        <div class="status-box">Current layer: <span class="value" id="layer-1">—</span></div>
      </section>

      <section class="column" data-printer="2">
        <div class="status-box" id="status-2">—</div>
        <div class="status-box">Current layer: <span class="value" id="layer-2">—</span></div>
      </section>
    </div>
  </div>

  <script>
    function formatValue(value) {
      if (value === null || value === undefined) return "—";
      if (typeof value === "number") return value.toLocaleString("en-US", { maximumFractionDigits: 2 });
      return String(value);
    }

    async function fetchStatus() {
      try {
        const res = await fetch("/api/status");
        if (!res.ok) return;
        const data = await res.json();

        document.getElementById("clock").textContent = data.date_time || "—";

        for (const key of ["printer1", "printer2"]) {
          const num = key === "printer1" ? "1" : "2";
          const p = data[key];
          if (!p) continue;

          const statusText = p.state_status
            ? `${p.label || p.ip}: ${p.state_status}`
            : `${p.label || p.ip}: offline`;
          document.getElementById(`status-${num}`).textContent = statusText;

          const layerEl = document.getElementById(`layer-${num}`);
          layerEl.textContent = formatValue(p.layer);
          layerEl.classList.toggle("muted", p.layer === null || p.layer === undefined);
        }
      } catch (_) {
        /* server may be starting */
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 1000);
  </script>
</body>
</html>
