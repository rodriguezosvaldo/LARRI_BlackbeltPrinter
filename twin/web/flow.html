<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlackBelt data flow</title>
<style>
  :root {
    --bg: #0e1013; --panel: #161a1f; --line: #2a3038; --text: #e8ecf0; --muted: #8a94a0;
    --accent: #ff8a3d; --card: #1b2026; --group: rgba(255,255,255,.025);
    --c-status: #4ea8f2; --c-gcode: #46d9c8; --c-alert: #ff8a3d; --c-logs: #3ccf7a; --c-weight: #f2c14e;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f8; --panel: #ffffff; --line: #d5dbe1; --text: #1c2228; --muted: #5f6b77;
      --card: #ffffff; --group: rgba(0,0,0,.03);
      --c-status: #1f7fd1; --c-gcode: #0f9e8f; --c-alert: #e06a1b; --c-logs: #1c9e52; --c-weight: #c08a00;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1rem; font-weight: 650; }
  header a { color: var(--muted); font-size: .8rem; text-decoration: none; }
  header a:hover { color: var(--text); }
  .ctrl { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .8rem; color: var(--muted); }
  button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 7px;
           font: inherit; font-size: .8rem; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 12px; padding: 0 12px 12px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  svg#map { display: block; width: 100%; height: auto; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
          font-size: .88rem; align-self: start; }
  aside h2 { margin: 0 0 6px; font-size: 1rem; }
  aside h3 { margin: 14px 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  aside p { margin: 6px 0; }
  aside ul { margin: 4px 0; padding-left: 18px; }
  aside li { margin: 3px 0; }
  .muted { color: var(--muted); }
  .flowlink { cursor: pointer; border-bottom: 1px dotted var(--muted); }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .ring { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--muted);
          margin-right: 6px; vertical-align: -1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 14px; border-top: 1px solid var(--line);
            font-size: .8rem; color: var(--muted); }
  .stories { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 14px; border-top: 1px solid var(--line); }
  .stories .lbl { font-size: .8rem; color: var(--muted); margin-right: 4px; }
  .caption { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line);
             background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
  .caption.show { display: flex; }
  .caption .txt { flex: 1; font-size: .95rem; }
  .caption .step { font-size: .75rem; color: var(--muted); white-space: nowrap; }

  /* SVG */
  .group rect { fill: var(--group); stroke: var(--line); stroke-dasharray: 5 5; }
  .group text { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
  .node { cursor: pointer; transition: opacity .3s; }
  .node rect.card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; transition: stroke .2s; }
  .node:hover rect.card, .node.sel rect.card { stroke: var(--muted); }
  .node .t1 { fill: var(--text); font-size: 14px; font-weight: 650; }
  .node .t2 { fill: var(--muted); font-size: 11.5px; }
  .node .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .node.ping rect.card { animation: ping .7s ease-out; }
  @keyframes ping { 0% { stroke: var(--pc); stroke-width: 4; } 100% { stroke: var(--line); stroke-width: 1.5; } }
  .flow { transition: opacity .3s; }
  .flow .line { fill: none; stroke-width: 2; stroke-opacity: .45; }
  .flow .hit { fill: none; stroke: transparent; stroke-width: 16; cursor: help; }
  .flow:hover .line, .flow.sel .line { stroke-opacity: 1; stroke-width: 3; }
  .flow .flabel { font-size: 11.5px; fill: var(--muted); pointer-events: none; }
  .flow:hover .flabel, .flow.sel .flabel { fill: var(--text); }
  svg.focus .flow:not(.on) { opacity: .1; }
  svg.focus .node:not(.on) { opacity: .35; }
  .pkt-data { filter: url(#glow); }
  .pkt-req { stroke-width: 2; fill: var(--panel); }

  #tip { position: fixed; z-index: 10; pointer-events: none; max-width: 300px; background: var(--panel);
         border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .82rem;
         box-shadow: 0 6px 24px rgba(0,0,0,.35); display: none; }
  #tip b { display: block; margin-bottom: 2px; }
</style>
</head>
<body>
<header>
  <h1>How data moves between the printers, the ESP32s and the PC</h1>
  <a href="/">← Twin</a>
  <div class="ctrl">
    <button id="pause">Pause</button>
    <label>Speed <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label>
  </div>
</header>
<main>
  <div class="stage">
    <svg id="map" viewBox="0 0 1200 750" role="img" aria-label="Data flow diagram"></svg>
    <div class="caption" id="caption">
      <span class="step" id="capStep"></span>
      <span class="txt" id="capText"></span>
      <button id="capPrev">Back</button>
      <button id="capNext">Next</button>
      <button id="capExit">Exit</button>
    </div>
    <div class="stories" id="stories"><span class="lbl">Show me what happens when…</span></div>
    <div class="legend" id="legend"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="tip"></div>
<script src="flow.js"></script>
</body>
</html>
